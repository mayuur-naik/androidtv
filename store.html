<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Android TV MOD Apps Store | Premium App Store for TV</title>
    <meta name="description" content="Browse our massive library of premium, ad-free Android TV mod apps. Download all apk for free.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE DESIGN SYSTEM --- */
        :root {
            --bg: #000000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --glass: rgba(20, 20, 20, 0.4);
            --glass-hover: rgba(40, 40, 40, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --accent: #2563eb;
            --neon-blue: #0A84FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* --- NAVIGATION --- */
        nav {
            padding: 24px 20px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .home-btn:hover { color: var(--text-main); }

        /* --- HEADER & SEARCH --- */
        .store-header {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .store-header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 30px;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 30px;
            position: relative;
        }
        .search-input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 18px 24px 18px 50px;
            border-radius: 100px;
            font-size: 1.1rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(10, 132, 255, 0.2);
        }
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
        }

        /* --- CATEGORY FILTERS --- */
        .filters {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }
        .filter-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 10px 24px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: black;
            border-color: white;
        }

        /* --- THE GRID --- */
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* --- APP CARDS --- */
        .app-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(20px);
            transition: transform 0.3s, border-color 0.3s, background 0.3s;
        }
        .app-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            background: var(--glass-hover);
        }

        .card-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        /* Fallback icon style for apps you haven't uploaded images for yet */
        .fallback-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .card-info h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .card-info p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .card-tag {
            display: inline-block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
        }

        /* Hide element class for JavaScript filtering */
        .hidden { display: none !important; }

        /* --- MOBILE FIXES --- */
        @media (max-width: 600px) {
            .filters {
                justify-content: flex-start;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 10px;
                /* Hide scrollbar but keep swipe */
                scrollbar-width: none;
            }
            .filters::-webkit-scrollbar { display: none; }
            .filter-btn { flex-shrink: 0; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" style="font-weight: 800; letter-spacing: 2px;">ANDROID TV TOOLS</div>
        <a href="index.html" class="home-btn">
            Home
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
    </nav>

    <header class="store-header">
        <h1>MOD Apps Store TV</h1>
        
        <div class="search-container">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search for Netflix, YouTube, Utilities...">
        </div>

        <div class="filters" id="filterContainer">
            <button class="filter-btn active" data-filter="all">All Mods</button>
            <button class="filter-btn" data-filter="ott">OTT & Streaming</button>
            <button class="filter-btn" data-filter="player">Players</button>
            <button class="filter-btn" data-filter="utility">Utilities</button>
        </div>
    </header>

    <main class="grid-container" id="appGrid">
        
        <a href="apps/netflix.html" class="app-card" data-category="ott" data-title="netflix tv mod premium">
            <img src="assets/images/netflix-logo.webp" alt="Netflix" class="card-icon">
            <div class="card-info">
                <h3>Netflix TV MOD</h3>
                <p>Premium Unlocked</p>
                <span class="card-tag" style="color: #E50914; background: rgba(229,9,20,0.1);">OTT</span>
            </div>
        </a>

        <a href="#" class="app-card" data-category="player" data-title="smarttube ad free youtube">
            <div class="fallback-icon" style="color: #ff0000; background: rgba(255,0,0,0.1);">▶</div>
            <div class="card-info">
                <h3>SmartTube</h3>
                <p>Ad-Free + SponsorBlock</p>
                <span class="card-tag">Player</span>
            </div>
        </a>

        <a href="#" class="app-card" data-category="ott" data-title="sonyliv premium mod">
            <div class="fallback-icon" style="color: #fc6027; background: rgba(252,96,39,0.1);">S</div>
            <div class="card-info">
                <h3>SonyLIV Mod</h3>
                <p>Premium Shows Unlocked</p>
                <span class="card-tag">OTT</span>
            </div>
        </a>

        <a href="#" class="app-card" data-category="utility" data-title="background apps process speed">
            <div class="fallback-icon" style="color: #30D158; background: rgba(48,209,88,0.1);">⚙️</div>
            <div class="card-info">
                <h3>Process Killer</h3>
                <p>Free up RAM instantly</p>
                <span class="card-tag">Utility</span>
            </div>
        </a>

    </main>

    <script>
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const appCards = document.querySelectorAll('.app-card');

        // Function to filter cards based on search text and category button
        function filterApps() {
            const searchTerm = searchInput.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');

            appCards.forEach(card => {
                const title = card.getAttribute('data-title').toLowerCase();
                const category = card.getAttribute('data-category');
                
                const matchesSearch = title.includes(searchTerm);
                const matchesCategory = activeFilter === 'all' || category === activeFilter;

                if (matchesSearch && matchesCategory) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // Search Input Listener
        searchInput.addEventListener('input', filterApps);

        // Category Buttons Listener
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all buttons, add to the clicked one
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // Run the filter again
                filterApps();
            });
        });
    </script>
</body>
</html>
